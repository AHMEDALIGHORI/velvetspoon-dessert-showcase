const panel=$('#panel'),panelTitle=$('#panel-title'),panelEyebrow=$('#panel-eyebrow'),panelBody=$('#panel-body'),panelClose=$('#panel-close');const panelContent={About:{eyebrow:'The Velvetspoon story',title:'Made for the last spoonful',body:'Chilled dessert, reimagined for the everyday ritual. Velvetspoon pairs bold flavour with a beautifully designed can, so your favourite sweet moment can travel with you.'},Shop:{eyebrow:'Choose your craving',title:'Pick a flavour',body:'Explore the collection below, then use Shop now to add your chosen quantity to the cart.',shop:true},Contact:{eyebrow:'We would love to hear from you',title:'Say hello',body:'Questions, collaborations or just a very strong opinion about mousse? Write to hello@velvetspoon.example and our tiny dessert team will get back to you.'}};function openPanel(type){const c=panelContent[type];panelEyebrow.textContent=c.eyebrow;panelTitle.textContent=c.title;panelBody.innerHTML=`<p>${c.body}</p>${c.shop?`<div class="panel__list">${PRODUCTS.map((p,i)=>`<button data-flavour="${i}">${p.name.join(' ')} <span style="float:right;opacity:.7">${money(p.price)}</span></button>`).join('')}</div>`:''}${type==='Contact'?'<a class="panel__action" href="mailto:hello@velvetspoon.example">Email us</a>':''}`;panel.classList.add('is-open');panel.setAttribute('aria-hidden','false');document.body.dataset.panelOpen='true';panelClose.focus();panelBody.querySelectorAll('[data-flavour]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.flavour);closePanel();if(i!==index)go(i,1)}))}function closePanel(){panel.classList.remove('is-open');panel.setAttribute('aria-hidden','true');delete document.body.dataset.panelOpen}document.querySelectorAll('.pill a').forEach(link=>link.addEventListener('click',e=>{e.preventDefault();const label=link.textContent.trim();if(label==='Menu'){closePanel();return}openEnhancedPanel(label)}));panelClose.addEventListener('click',closePanel);panel.addEventListener('click',e=>{if(e.target===pan
